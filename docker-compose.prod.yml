services:
  # 1. The Guard (Nginx)
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - jottin-network
    restart: always

  # 2. Backend
  backend:
    image: ghcr.io/rievocante/jottin-backend:latest
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=8080
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY}
    restart: always
    networks:
      - jottin-network

  # 3. Frontend
  frontend:
    image: ghcr.io/rievocante/jottin-frontend:latest
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    depends_on:
      - backend
    restart: always
    networks:
      - jottin-network

networks:
  jottin-network:
    driver: bridge