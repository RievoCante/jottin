name: CI/CD Pipeline

concurrency:
  group: production-deployment
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  # Frontend CI Job
  frontend-ci:
    name: Frontend CI (Lint & Format)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Lint Check
      working-directory: ./frontend
      run: npm run lint:check

    - name: Format Check
      working-directory: ./frontend
      run: npm run format:check

  # Backend CI Job
  backend-ci:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true
        cache-dependency-path: backend/go.sum

    - name: Install Dependencies
      working-directory: ./backend
      run: make deps

    - name: Lint & Format Check
      working-directory: ./backend
      run: make check

    - name: Run Tests
      working-directory: ./backend
      run: make test

    - name: Build Binary
      working-directory: ./backend
      run: make build

  # CD Job
  build-push:
    name: Build & Push Docker Images
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/rievocante/jottin-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/rievocante/jottin-frontend:latest
          build-args: |
            VITE_API_URL=https://jottin.online/api
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

  # NEW: Deploy (Just Pull & Restart)
  cd:
    name: CD (Deploy to Production)
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd ~/jottin || exit 1
            
            # 1. Get the updated docker-compose file
            git pull origin main

            # 2. Pull the latest images
            # (This works without login ONLY if packages are Public)
            docker compose -f docker-compose.prod.yml pull

            # 3. Restart containers
            docker compose -f docker-compose.prod.yml up -d